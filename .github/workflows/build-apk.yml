name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate project root (folder containing gradlew)
        id: find_root
        run: |
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Could not find a 'gradlew' file anywhere in this repository. Make sure you uploaded the CONTENTS of the SMSLocationFinder folder to the repo root, not the folder itself nested inside another folder."
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at: $GRADLEW_PATH"
          echo "Using project root: $PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.find_root.outputs.root }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.find_root.outputs.root }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMSLocationFinder-debug-apk
          path: ${{ steps.find_root.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
